name: FANDEX-App Release

# 触发条件：
#   1. 推送 v* 格式的 Tag（如 v2.1.0）
#   2. 手动触发（便于失败后重跑，无需重新打 tag）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag 名称（如 v3.7.0），用于重新发布该版本'
        required: true
        type: string

# Release 流水线需要写权限以创建 GitHub Release
permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # workflow_dispatch 时拉取指定 tag；tag push 时 ref 已带 tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # 从 Secrets 解码签名密钥库
      # 使用 env 传递 secret 避免直接插值到 run 脚本（防注入最佳实践）
      - name: Decode Keystore
        env:
          FANDEX_KEYSTORE_BASE64: ${{ secrets.FANDEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FANDEX_KEYSTORE_BASE64" ]; then
            echo "WARNING: FANDEX_KEYSTORE_BASE64 secret is empty, release signing will fail"
            exit 1
          fi
          echo "$FANDEX_KEYSTORE_BASE64" | base64 -d > android/fandex-release.jks

      # 构建签名 Release APK
      - name: Build Release APK
        working-directory: android
        env:
          FANDEX_KEYSTORE_PASSWORD: ${{ secrets.FANDEX_KEYSTORE_PASSWORD }}
          FANDEX_KEY_ALIAS: ${{ secrets.FANDEX_KEY_ALIAS }}
          FANDEX_KEY_PASSWORD: ${{ secrets.FANDEX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 读取版本号用于 Release 命名
      # 从 appVersionName 顶级变量读取（避免 versionName = appVersionName 间接引用）
      - name: Read version
        id: version
        working-directory: android
        run: |
          VERSION=$(grep -E '^[[:space:]]*val[[:space:]]+appVersionName[[:space:]]*=' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "ERROR: Failed to read appVersionName from app/build.gradle.kts"
            exit 1
          fi
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 重命名 APK 为规范化命名 FANDEX-App_${version}.apk
      # 规范命名便于用户识别版本,与 Release assets 命名规范一致
      - name: Rename APK
        working-directory: android
        shell: bash
        run: |
          mkdir -p app/build/outputs/apk/release
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} app/build/outputs/apk/release/FANDEX-App_${{ steps.version.outputs.version }}.apk \;
          echo "Renamed APK:"
          ls -la app/build/outputs/apk/release/

      # 生成 APK sha256 校验文件,便于用户校验下载完整性
      - name: Generate checksums
        working-directory: android
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/release/FANDEX-App_${{ steps.version.outputs.version }}.apk > FANDEX-App_${{ steps.version.outputs.version }}_checksums.txt
          echo "Checksums generated:"
          cat FANDEX-App_${{ steps.version.outputs.version }}_checksums.txt

      # 上传 Release APK 为 Artifact（90 天保留）
      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: fandex-release-apk
          path: android/app/build/outputs/apk/release/FANDEX-App_*.apk
          retention-days: 90
          if-no-files-found: error

      # 创建 GitHub Release 并附加 APK
      # 改用 gh CLI 替代 softprops/action-gh-release：
      # 仓库策略禁止使用第三方非 GitHub 官方、非 Marketplace 已验证的 action
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: android
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          # 若 Release 已存在（workflow_dispatch 重跑场景），先删除后重建
          if gh release view "${TAG_NAME}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists, deleting for re-creation"
            gh release delete "${TAG_NAME}" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag=false || true
          fi
          # 创建 Release 并附加 APK 与校验文件
          gh release create "${TAG_NAME}" \
            -R "$GITHUB_REPOSITORY" \
            --title "FANDEX-App v${{ steps.version.outputs.version }}" \
            --notes "## FANDEX-App v${{ steps.version.outputs.version }}

          ### 下载
          选择下方 APK 文件直接下载安装。

          ### 环境要求
          - Android 8.0 (API 26) 或更高版本
          - 允许\"安装未知来源应用\"权限

          ### 更新方式
          下载最新 APK 覆盖安装即可。" \
            app/build/outputs/apk/release/FANDEX-App_${{ steps.version.outputs.version }}.apk \
            FANDEX-App_${{ steps.version.outputs.version }}_checksums.txt
