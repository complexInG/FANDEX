<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/FANDEX-App/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FANDEX-App - Android 原生代码语法离线速查应用，22 模块 313 篇速查文档，完全离线，Kotlin + Jetpack Compose 原生渲染。" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>FANDEX-App · 代码语法离线速查</title>

    <!-- 字体预连接：对齐 FANDEX-Web 字体栈 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- 防闪烁脚本：在 HTML 解析前设置 data-theme，避免主题闪烁（FOUC）
         对齐 FANDEX-Web docs/design-system.md 防闪烁机制 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fandex-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          // 同步设置 color-scheme，确保浏览器原生控件（滚动条等）立即响应
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
