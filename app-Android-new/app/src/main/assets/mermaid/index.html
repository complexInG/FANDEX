<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /* 视口：垂直方向的手势交还给原生页面滚动（LazyColumn），横向与捏合由 JS 处理 */
  #viewport {
    width: 100%;
    overflow: hidden;
    touch-action: pan-y;
  }
  /* 舞台：通过 transform 承载缩放与平移 */
  #stage {
    transform-origin: 0 0;
    width: max-content;
  }
  #stage svg { display: block; }
  .error { color: #DC2626; font: 12px/1.5 monospace; padding: 8px; word-break: break-all; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script>
  // mermaid 离线渲染宿主（Android WebView）
  // - 渲染完成后按"内容自然尺寸"回报高度，WebView 高度自适应，超宽图不再被压缩
  // - 内置手势体系：初始适配宽度；双指捏合缩放；单指横向平移；双击在"适配"与"1:1"间切换
  var viewport = document.getElementById('viewport');
  var stage = document.getElementById('stage');
  var natural = { w: 0, h: 0 };   // SVG 自然尺寸（px）
  var scale = 1;                  // 当前缩放
  var tx = 0;                     // 横向平移（<=0）
  var minScale = 1;

  function clampTx() {
    var vw = viewport.clientWidth;
    var sw = natural.w * scale;
    var min = Math.min(0, vw - sw);
    if (tx > 0) tx = 0;
    if (tx < min) tx = min;
    if (sw <= vw) tx = 0;
  }

  function apply() {
    clampTx();
    stage.style.transform = 'translateX(' + tx + 'px) scale(' + scale + ')';
    viewport.style.height = Math.ceil(natural.h * scale) + 'px';
    // 回报缩放后的实际高度，供 Compose 侧调整 WebView 高度
    if (window.AndroidBridge && AndroidBridge.onHeight) {
      AndroidBridge.onHeight(Math.ceil(natural.h * scale));
    }
  }

  function fit() {
    var vw = viewport.clientWidth;
    scale = Math.min(1, vw / natural.w);
    minScale = scale;
    tx = 0;
    apply();
  }

  function zoomTo(s) {
    scale = Math.max(minScale, Math.min(4, s));
    apply();
  }

  // 渲染：theme 为 'dark' / 'neutral'；useMaxWidth=false 保留自然尺寸
  async function renderMermaid(code, theme) {
    try {
      mermaid.initialize({
        startOnLoad: false,
        theme: theme || 'neutral',
        flowchart: { useMaxWidth: false },
        sequence: { useMaxWidth: false },
        gantt: { useMaxWidth: false },
        journey: { useMaxWidth: false },
        class: { useMaxWidth: false },
        state: { useMaxWidth: false },
        er: { useMaxWidth: false },
        pie: { useMaxWidth: false },
        mindmap: { useMaxWidth: false },
        timeline: { useMaxWidth: false }
      });
      var result = await mermaid.render('mmd' + Date.now(), code);
      stage.innerHTML = result.svg;
      var svg = stage.querySelector('svg');
      if (svg) {
        svg.style.maxWidth = 'none';
        var bbox = svg.getBBox();
        natural.w = Math.ceil(bbox.width);
        natural.h = Math.ceil(bbox.height);
        svg.setAttribute('width', natural.w);
        svg.setAttribute('height', natural.h);
      }
      fit();
    } catch (e) {
      stage.innerHTML = '<div class="error">图表渲染失败，请查看源码</div>';
      natural = { w: 0, h: 0 };
      if (window.AndroidBridge && AndroidBridge.onError) {
        AndroidBridge.onError(String(e));
      }
    }
  }

  // ---- 手势：单指横向平移 / 双指捏合缩放 / 双击切换适配与 1:1 ----
  var touches = [];
  var pinchStart = null; // {dist, scale, cx, tx}
  var lastTap = 0;
  var panning = false;
  var panStartX = 0;
  var panStartTx = 0;

  viewport.addEventListener('touchstart', function (ev) {
    touches = Array.prototype.slice.call(ev.touches);
    if (ev.touches.length === 2) {
      var dx = ev.touches[0].clientX - ev.touches[1].clientX;
      var dy = ev.touches[0].clientY - ev.touches[1].clientY;
      var cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
      pinchStart = { dist: Math.sqrt(dx * dx + dy * dy), scale: scale, tx: tx, cx: cx };
      panning = false;
    } else if (ev.touches.length === 1) {
      // 双击检测（切换适配 / 1:1）
      var now = Date.now();
      if (now - lastTap < 280) {
        if (scale > minScale + 0.01) { fit(); } else { zoomTo(1); }
        lastTap = 0;
        panning = false;
        pinchStart = null;
        return;
      }
      lastTap = now;
      panning = true;
      panStartX = ev.touches[0].clientX;
      panStartTx = tx;
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', function (ev) {
    if (ev.touches.length === 2 && pinchStart) {
      ev.preventDefault();
      var dx = ev.touches[0].clientX - ev.touches[1].clientX;
      var dy = ev.touches[0].clientY - ev.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
      var s2 = pinchStart.scale * (dist / pinchStart.dist);
      // 以捏合中心为焦点缩放，保持视觉锚点
      var ratio = Math.max(minScale, Math.min(4, s2)) / pinchStart.scale;
      tx = pinchStart.cx - ratio * (pinchStart.cx - pinchStart.tx);
      zoomTo(s2);
      panning = false;
    } else if (ev.touches.length === 1 && panning && natural.w * scale > viewport.clientWidth) {
      ev.preventDefault();
      tx = panStartTx + (ev.touches[0].clientX - panStartX);
      apply();
    }
  }, { passive: false });

  viewport.addEventListener('touchend', function () {
    pinchStart = null;
    panning = false;
  });
</script>
</body>
</html>
