<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  /* 视口：垂直方向的手势交还给原生页面滚动（LazyColumn），横向与捏合由 JS 处理 */
  #viewport {
    width: 100%;
    overflow: hidden;
    touch-action: pan-y;
  }
  /* 舞台：通过 transform 承载缩放与平移；
     固定合成层（will-change + translate3d）避免每帧重排，这是缩放流畅度的关键 */
  #stage {
    transform-origin: 0 0;
    width: max-content;
    will-change: transform;
  }
  #stage svg { display: block; }
  .error { color: #DC2626; font: 12px/1.5 monospace; padding: 8px; word-break: break-all; }
</style>
<script src="mermaid.min.js"></script>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script>
  // mermaid 离线渲染宿主（Android WebView）
  // - 渲染完成后按"内容自然尺寸"回报高度，WebView 高度自适应，超宽图不再被压缩
  // - 手势体系：初始适配宽度；单指横向平移；双指捏合缩放 + 二维拖动；
  //   双击在"适配"与"1:1"间切换
  // - 性能关键点：
  //   1. 手势进行中只更新 transform（rAF 合帧），锁定容器高度，不向原生回报，
  //      切断 "JS 回报 -> Compose 重布局 -> WebView 尺寸变化" 的每帧回环抖动
  //   2. 高度回报只在渲染完成 / 双击切换 / 手势结束时各执行一次
  var viewport = document.getElementById('viewport');
  var stage = document.getElementById('stage');
  var natural = { w: 0, h: 0 };   // SVG 自然尺寸（px）
  var scale = 1;                  // 当前缩放
  var tx = 0, ty = 0;             // 平移偏移（均 <= 0）
  var minScale = 1;
  var gesture = false;            // 手势进行中：锁定高度，暂停回报
  var rafPending = false;

  function clampPos() {
    var vw = viewport.clientWidth;
    var vh = viewport.clientHeight;
    var sw = natural.w * scale;
    var sh = natural.h * scale;
    var minTx = Math.min(0, vw - sw);
    var minTy = Math.min(0, vh - sh);
    if (tx > 0) tx = 0;
    if (tx < minTx) tx = minTx;
    if (sw <= vw) tx = 0;
    if (ty > 0) ty = 0;
    if (ty < minTy) ty = minTy;
    if (sh <= vh) ty = 0;
  }

  // report=true 时向原生回报缩放后的实际高度（供 Compose 侧调整 WebView 高度）
  function apply(report) {
    clampPos();
    stage.style.transform =
      'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + scale + ')';
    viewport.style.height = Math.ceil(natural.h * scale) + 'px';
    if (report && window.AndroidBridge && AndroidBridge.onHeight) {
      AndroidBridge.onHeight(Math.ceil(natural.h * scale));
    }
  }

  // rAF 合帧：touchmove 高频事件只记录状态，每帧最多执行一次 transform 更新
  function scheduleApply() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      apply(false);
    });
  }

  function fit() {
    var vw = viewport.clientWidth;
    scale = Math.min(1, vw / natural.w);
    minScale = scale;
    tx = 0;
    ty = 0;
    apply(true);
  }

  function zoomTo(s) {
    scale = Math.max(minScale, Math.min(4, s));
    apply(gesture ? false : true);
  }

  // 渲染：theme 为 'dark' / 'neutral'；useMaxWidth=false 保留自然尺寸
  async function renderMermaid(code, theme) {
    try {
      mermaid.initialize({
        startOnLoad: false,
        theme: theme || 'neutral',
        flowchart: { useMaxWidth: false },
        sequence: { useMaxWidth: false },
        gantt: { useMaxWidth: false },
        journey: { useMaxWidth: false },
        class: { useMaxWidth: false },
        state: { useMaxWidth: false },
        er: { useMaxWidth: false },
        pie: { useMaxWidth: false },
        mindmap: { useMaxWidth: false },
        timeline: { useMaxWidth: false }
      });
      var result = await mermaid.render('mmd' + Date.now(), code);
      stage.innerHTML = result.svg;
      var svg = stage.querySelector('svg');
      if (svg) {
        svg.style.maxWidth = 'none';
        var bbox = svg.getBBox();
        natural.w = Math.ceil(bbox.width);
        natural.h = Math.ceil(bbox.height);
        svg.setAttribute('width', natural.w);
        svg.setAttribute('height', natural.h);
      }
      fit();
    } catch (e) {
      stage.innerHTML = '<div class="error">图表渲染失败，请查看源码</div>';
      natural = { w: 0, h: 0 };
      if (window.AndroidBridge && AndroidBridge.onError) {
        AndroidBridge.onError(String(e));
      }
    }
  }

  // ---- 手势：单指横向平移 / 双指捏合缩放 + 二维拖动 / 双击切换适配与 1:1 ----
  var lastTap = 0;
  var pinch = null;     // 双指手势起点 {dist, cx, cy, scale, tx, ty}
  var pan = null;       // 单指平移起点 {x, tx}

  viewport.addEventListener('touchstart', function (ev) {
    if (ev.touches.length === 2) {
      var dx = ev.touches[0].clientX - ev.touches[1].clientX;
      var dy = ev.touches[0].clientY - ev.touches[1].clientY;
      pinch = {
        dist: Math.sqrt(dx * dx + dy * dy),
        cx: (ev.touches[0].clientX + ev.touches[1].clientX) / 2,
        cy: (ev.touches[0].clientY + ev.touches[1].clientY) / 2,
        scale: scale,
        tx: tx,
        ty: ty
      };
      pan = null;
      gesture = true;
      return;
    }
    if (ev.touches.length === 1) {
      // 双击检测（切换适配 / 1:1）
      var now = Date.now();
      if (now - lastTap < 280) {
        lastTap = 0;
        pan = null;
        pinch = null;
        gesture = false;
        if (scale > minScale + 0.01) { fit(); } else { zoomTo(1); }
        return;
      }
      lastTap = now;
      pan = { x: ev.touches[0].clientX, tx: tx };
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', function (ev) {
    if (ev.touches.length === 2 && pinch) {
      ev.preventDefault();
      var dx = ev.touches[0].clientX - ev.touches[1].clientX;
      var dy = ev.touches[0].clientY - ev.touches[1].clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
      var cy = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
      var s2 = pinch.scale * (dist / pinch.dist);
      var ratio = Math.max(minScale, Math.min(4, s2)) / pinch.scale;
      // 以捏合中心为焦点缩放：内容点跟随手指（含双指整体拖动）
      tx = cx - ratio * (pinch.cx - pinch.tx);
      ty = cy - ratio * (pinch.cy - pinch.ty);
      scale = Math.max(minScale, Math.min(4, s2));
      scheduleApply();
      return;
    }
    if (ev.touches.length === 1 && pan && natural.w * scale > viewport.clientWidth) {
      ev.preventDefault();
      tx = pan.tx + (ev.touches[0].clientX - pan.x);
      scheduleApply();
    }
  }, { passive: false });

  function endGesture() {
    if (pinch || pan) {
      pinch = null;
      pan = null;
      if (gesture) {
        gesture = false;
        // 手势结束：一次性回报最终高度，Compose 侧据此调整 WebView 高度
        apply(true);
      }
    }
  }
  viewport.addEventListener('touchend', endGesture);
  viewport.addEventListener('touchcancel', endGesture);
</script>
</body>
</html>
